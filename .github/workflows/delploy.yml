name: Deploy Laravel to Lolipop

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # ロリポップのバージョンに合わせる

    - name: Install Dependencies
      run: |
        composer install --no-dev --optimize-autoloader
        npm install && npm run build # Vite等を使っている場合

    - name: Deploy via rsync
      uses: AEnterprise/rsync-deploy@v1.0.2
      env:
        DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-avz --delete"
        SERVER_PORT: ${{ secrets.SSH_PORT }}
        SERVER_IP: ${{ secrets.SSH_HOST }}
        USERNAME: ${{ secrets.SSH_USER }}
        # ロリポップ上のデプロイ先パス
        FOLDER: "./src/"
        SERVER_DEST: "/home/users/0/main.jp-web-server/web/study_space/laravel-test"

    - name: Execute remote ssh commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /home/users/0/main.jp-web-server/web/study_space/laravel-test
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache