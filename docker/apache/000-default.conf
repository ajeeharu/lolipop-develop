<VirtualHost *:80>
    # ロリポップの公開ディレクトリ構造に合わせた設定
    DocumentRoot /lolipop-container/public

    <Directory /lolipop-container/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>