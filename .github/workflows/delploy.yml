name: Deploy Laravel to Lolipop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # これを追加！内容（インデント等）は空でOK

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # PHPのセットアップ（バージョンは自分の環境に合わせて変更してください）
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, zip
        coverage: none

    # Node.jsのセットアップ（Viteやnpm run build用）
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./src
      run: |
        composer install --no-dev --optimize-autoloader
        npm install
        npm run build

    - name: Deploy via rsync
      uses: AEnterprise/rsync-deploy@v1.0.2
      env:
        DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-avz --delete"
        SERVER_PORT: ${{ secrets.SSH_PORT }}
        SERVER_IP: ${{ secrets.SSH_HOST }}
        USERNAME: ${{ secrets.SSH_USER }}
        # ロリポップ上のデプロイ先パス
        FOLDER: "./src/"
        SERVER_DESTINATION: "/home/users/0/main.jp-web-server/web/study_space/laravel-test"

    - name: Run remote commands via native SSH
      run: |
        # 1. 秘密鍵を一時ファイルに書き出し
        echo "${{ secrets.SSH_KEY }}" > deploy_key
        chmod 600 deploy_key
        
        # 2. SSHコマンドで直接命令を送る
        # -o StrictHostKeyChecking=no でホスト確認をスキップ
        ssh -i deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/users/0/main.jp-web-server/web/study_space/laravel-test
          
          # パスを通す必要がある場合、フルパスで書くのが安全です
          /usr/local/php/8.4/bin/php artisan migrate --force
          /usr/local/php/8.4/bin/php artisan config:cache
          /usr/local/php/8.4/bin/php artisan route:cache
        EOF
        
        # 3. 鍵ファイルを削除
        rm deploy_key
