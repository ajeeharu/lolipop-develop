name: Deploy Laravel to Lolipop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # これを追加！内容（インデント等）は空でOK

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # PHPのセットアップ（バージョンは自分の環境に合わせて変更してください）
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, zip
        coverage: none

    # Node.jsのセットアップ（Viteやnpm run build用）
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./src
      run: |
        composer install --no-dev --optimize-autoloader
        npm install
        npm run build

    - name: Deploy via rsync
      uses: AEnterprise/rsync-deploy@v1.0.2
      env:
        DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-avz --delete"
        SERVER_PORT: ${{ secrets.SSH_PORT }}
        SERVER_IP: ${{ secrets.SSH_HOST }}
        USERNAME: ${{ secrets.SSH_USER }}
        # ロリポップ上のデプロイ先パス
        FOLDER: "./src/"
        SERVER_DEST: "/home/users/0/main.jp-web-server/web/study_space/laravel-test"

    - name: Execute remote ssh commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /home/users/0/main.jp-web-server/web/study_space/laravel-test
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache